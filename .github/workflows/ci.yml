name: CI/CD

# 触发条件
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch: # 手动触发

env:
  # Tauri 需要
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # ═══════════════════════════════════════════════════
  # 0. 自动打版本 tag（push master 时检测 tauri.conf.json 版本号，
  #    高于最新 v* tag 则自动创建并推送 tag，触发下方打包发布流程，无需手动打 tag）
  # ═══════════════════════════════════════════════════
  auto-tag:
    name: Auto Tag (version bump)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取全部历史与 tag，用于版本比较

      - name: Auto create tag if version bumped
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$latest_tag" ]; then
            echo "未找到已有 v* tag，跳过自动打 tag"
            exit 0
          fi
          latest=${latest_tag#v}
          echo "当前版本: $version, 最新 tag: $latest_tag"
          higher=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)
          if [ "$higher" = "$version" ] && [ "$version" != "$latest" ]; then
            git tag "v$version"
            # || true：若并发 run 已创建同名 tag，推送失败也无需报错（tag 触发流程会处理打包）
            git push origin "v$version" || true
            echo "已自动创建并推送 tag: v$version"
          else
            echo "版本 $version 不高于最新 tag $latest_tag，跳过自动打 tag"
          fi

  # ═══════════════════════════════════════════════════
  # 1. 代码校验 + 前端编译 + 单元测试（Windows，与目标平台一致）
  # ═══════════════════════════════════════════════════
  lint-build-test:
    name: Lint & Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Vite production build
        run: npm run build

      # Rust 后端
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cargo check (backend)
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo clippy (backend)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo test (backend)
        working-directory: src-tauri
        run: cargo test --locked

  # ═══════════════════════════════════════════════════
  # 2. Windows 打包（发布/手动触发时执行）
  #    需要 secrets：TAURI_SIGNING_PRIVATE_KEY 等
  # ═══════════════════════════════════════════════════
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: lint-build-test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Tauri build (NSIS + MSI)
        working-directory: src-tauri
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 从 Tauri 生成的 .sig 文件中读取 NSIS/MSI 签名（文件内容即 signature）
      #（Tauri 2 CI 构建只产出 .sig 签名文件，不产出 update 元数据 JSON）
      - name: Extract updater signatures
        shell: pwsh
        run: |
          function Get-Sig([string]$dir) {
            $dir = (Resolve-Path $dir).Path
            $files = @(Get-ChildItem -Path $dir -Filter "*.sig" -ErrorAction Stop)
            if ($files.Count -ne 1) { throw "Expected exactly 1 .sig file in $dir, found $($files.Count)" }
            return [System.IO.File]::ReadAllText($files[0].FullName).Trim()
          }
          $out = @{
            nsis = Get-Sig "src-tauri/target/release/bundle/nsis"
            msi  = Get-Sig "src-tauri/target/release/bundle/msi"
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/smompublish-signatures.json", $out)

      # 将安装包复制到扁平目录（upload-artifact 会保留上传路径，不扁平化会导致 release 步骤匹配不到文件）
      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/nsis, dist/msi | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" dist/nsis/
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" dist/msi/

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/nsis/*.exe
            dist/msi/*.msi

      - name: Upload updater signatures
        uses: actions/upload-artifact@v4
        with:
          name: updater-signatures
          path: smompublish-signatures.json
          if-no-files-found: error

  # ═══════════════════════════════════════════════════
  # 3. 发布 GitHub Release（tag 触发时）
  # ═══════════════════════════════════════════════════
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./dist

      - name: Download updater signatures
        uses: actions/download-artifact@v4
        with:
          name: updater-signatures
          path: ./sigs

      # 自动更新 update.json：写入 NSIS/MSI 签名、真实文件名 URL、版本号与发布日期
      #（签名由构建时私钥在 Actions 环境中生成，无法预先计算，故在此补齐）
      - name: Update update.json with signatures
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, glob, datetime

          # tag 名如 v0.0.31 → 版本 0.0.31
          ref = os.environ["GITHUB_REF"]
          version = ref.rsplit("/", 1)[-1].lstrip("v")
          # Release 下载路径使用完整 tag 名（含 v），否则链接 404
          tag = ref.rsplit("/", 1)[-1]

          base = "https://github.com/SIE-Operations-and-Maintenance-Team/publish-tools/releases/download/" + tag
          with open("update.json", encoding="utf-8") as f:
              data = json.load(f)

          nsis_exe = os.path.basename(glob.glob("dist/nsis/*.exe")[0])
          msi_file = os.path.basename(glob.glob("dist/msi/*.msi")[0])

          with open("sigs/smompublish-signatures.json", encoding="utf-8") as f:
              sigs = json.load(f)

          old_version = data["version"]  # 发布前版本号（notes 中下载链接/文件名指向的旧版本）
          data["version"] = version
          data["pub_date"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          if old_version not in data["notes"]:
              print(f"WARNING: '{old_version}' not found in notes; download links will keep the old version", flush=True)
          data["notes"] = data["notes"].replace(old_version, version)
          data["platforms"]["windows-x86_64"] = {
              "signature": sigs["nsis"],
              "url": base + "/" + nsis_exe,
          }
          data["platforms"]["windows-msi"] = {
              "signature": sigs["msi"],
              "url": base + "/" + msi_file,
          }

          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
              f.write("\n")
          EOF

      # 将自动补全的 update.json 推回 master（[skip ci] 避免再次触发流水线）
      - name: Push update.json back to master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先备份本步生成的 update.json（Python 步骤已写入新签名/版本）
          cp update.json /tmp/update.json.new
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CI 运行时 master 可能有新提交，先同步到最新远程状态（runner 是 detached HEAD，不能直接 rebase）
          git fetch origin master
          git checkout -B master FETCH_HEAD
          # 恢复本步生成的 update.json，再与远程 master 对比
          cp /tmp/update.json.new update.json
          if git diff --quiet -- update.json; then
            echo "update.json 无变化，跳过推送"
            exit 0
          fi
          git add update.json
          git commit -m "chore(ci): update update.json for ${GITHUB_REF##*/} [skip ci]"
          git push origin HEAD:master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/nsis/*.exe
            ./dist/msi/*.msi
          generate_release_notes: true
