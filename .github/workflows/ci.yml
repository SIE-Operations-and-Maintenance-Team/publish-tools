name: CI/CD

# 触发条件
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch: # 手动触发

# 发布流程（重要）：
#   1. 升级版本号：npm run version:bump -- 0.0.40
#      （以 package.json 为唯一事实源，自动同步 package-lock.json / Cargo.toml，并在 CHANGELOG.md 插入新版本骨架）
#   2. 填写 CHANGELOG.md 当前版本条目，提交推送 master
#   3. 本地打 tag 并推送：git tag vX.Y.Z && git push origin vX.Y.Z
#      （tag 必须等于 package.json 的 version 加 v 前缀，流水线会强制校验，不一致直接失败）
#   4. tag 推送（真实 push 事件）自动触发 lint → 打包 → 发布 GitHub Release，无需手动操作
#   （注意：GITHUB_TOKEN 推送 tag 不会触发 workflow，打 tag 必须用本地凭据）

env:
  # Tauri 需要
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # ═══════════════════════════════════════════════════
  # 1. 代码校验 + 前端编译 + 单元测试（Windows，与目标平台一致）
  # ═══════════════════════════════════════════════════
  lint-build-test:
    name: Lint & Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本一致性校验（fail fast）：package.json 是唯一事实源，Cargo.toml 由 bump 脚本同步；
      # tag 触发时强制 tag == package.json version，保证发布产物与 tag 一致
      - name: Verify version consistency
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          if (-not $cargo) { throw "无法从 src-tauri/Cargo.toml 解析版本号" }
          if ($pkg -ne $cargo) { throw "版本不一致: package.json=$pkg, Cargo.toml=$cargo（请用 npm run version:bump 统一升级）" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF -replace '^refs/tags/v', ''
            if ($tagVersion -ne $pkg) { throw "git tag 与版本号不一致: tag=$tagVersion, package.json=$pkg（tag 必须为 v$pkg）" }
          }
          Write-Host "✔ 版本一致性校验通过: $pkg"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Vite production build
        run: npm run build

      # Rust 后端
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cargo check (backend)
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo clippy (backend)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo test (backend)
        working-directory: src-tauri
        run: cargo test --locked

  # ═══════════════════════════════════════════════════
  # 2. Windows 打包（发布/手动触发时执行）
  #    需要 secrets：TAURI_SIGNING_PRIVATE_KEY 等
  # ═══════════════════════════════════════════════════
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: lint-build-test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Tauri build (NSIS + MSI)
        working-directory: src-tauri
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 从 Tauri 生成的 .sig 文件中读取 NSIS/MSI 签名（文件内容即 signature）
      #（Tauri 2 CI 构建只产出 .sig 签名文件，不产出 update 元数据 JSON）
      - name: Extract updater signatures
        shell: pwsh
        run: |
          function Get-Sig([string]$dir) {
            $dir = (Resolve-Path $dir).Path
            $files = @(Get-ChildItem -Path $dir -Filter "*.sig" -ErrorAction Stop)
            if ($files.Count -ne 1) { throw "Expected exactly 1 .sig file in $dir, found $($files.Count)" }
            return [System.IO.File]::ReadAllText($files[0].FullName).Trim()
          }
          $out = @{
            nsis = Get-Sig "src-tauri/target/release/bundle/nsis"
            msi  = Get-Sig "src-tauri/target/release/bundle/msi"
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/smompublish-signatures.json", $out)

      # 将安装包复制到扁平目录（upload-artifact 会保留上传路径，不扁平化会导致 release 步骤匹配不到文件）
      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/nsis, dist/msi | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" dist/nsis/
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" dist/msi/

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/nsis/*.exe
            dist/msi/*.msi

      - name: Upload updater signatures
        uses: actions/upload-artifact@v4
        with:
          name: updater-signatures
          path: smompublish-signatures.json
          if-no-files-found: error

  # ═══════════════════════════════════════════════════
  # 3. 发布 GitHub Release（tag 触发时）
  # ═══════════════════════════════════════════════════
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./dist

      - name: Download updater signatures
        uses: actions/download-artifact@v4
        with:
          name: updater-signatures
          path: ./sigs

      # 更新 update.json：写入 NSIS/MSI 签名、真实文件名 URL、版本号与发布日期
      # notes / Release 正文统一从 CHANGELOG.md 的当前版本条目提取（找不到条目直接失败，避免发错上一版本说明）
      - name: Update update.json with signatures
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, glob, datetime, re, sys

          # tag 名如 v0.0.31 → 版本 0.0.31
          ref = os.environ["GITHUB_REF"]
          tag = ref.rsplit("/", 1)[-1]      # 完整 tag（含 v），Release 下载路径必须带 v，否则链接 404
          version = tag.lstrip("v")

          base = "https://github.com/SIE-Operations-and-Maintenance-Team/publish-tools/releases/download/" + tag

          nsis_exe = os.path.basename(glob.glob("dist/nsis/*.exe")[0])
          msi_file = os.path.basename(glob.glob("dist/msi/*.msi")[0])

          with open("sigs/smompublish-signatures.json", encoding="utf-8") as f:
              sigs = json.load(f)

          # 从 CHANGELOG.md 提取当前版本条目（唯一更新日志来源）
          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()
          m = re.search(rf"^## v{re.escape(version)}\s*\n(.*?)(?=^## |\Z)", changelog, re.S | re.M)
          if not m or not m.group(1).strip():
              sys.exit(f"CHANGELOG.md 中未找到 v{version} 条目，请先补充更新日志再打 tag")
          section = m.group(1).strip()

          # GitHub Release 正文：Markdown 原文
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(section + "\n")

          # update.json 的 notes：Markdown 转简单 HTML（升级弹窗用 v-html 渲染）
          lines = []
          for ln in section.splitlines():
              ln = ln.strip()
              if not ln:
                  continue
              if ln.startswith("### "):
                  lines.append(f"<b>{ln[4:]}</b>")
              elif ln.startswith("- "):
                  lines.append("• " + ln[2:])
              else:
                  lines.append(ln)
          notes = "<br>".join(lines)
          notes += f"<br><b>注：版本 ≤ 0.0.28 <a style='color:green' target='_blank' href='{base}/{nsis_exe}'>点击此处</a> 下载。</b>"

          with open("update.json", encoding="utf-8") as f:
              data = json.load(f)
          data["version"] = version
          data["pub_date"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          data["notes"] = notes
          data["platforms"]["windows-x86_64"] = {
              "signature": sigs["nsis"],
              "url": base + "/" + nsis_exe,
          }
          data["platforms"]["windows-msi"] = {
              "signature": sigs["msi"],
              "url": base + "/" + msi_file,
          }

          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
              f.write("\n")
          EOF

      # 将自动补全的 update.json 推回 master（[skip ci] 避免再次触发流水线）
      - name: Push update.json back to master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先备份本步生成的 update.json（Python 步骤已写入新签名/版本）
          cp update.json /tmp/update.json.new
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CI 运行时 master 可能有新提交，先同步到最新远程状态（runner 是 detached HEAD，不能直接 rebase）
          git fetch origin master
          git checkout -B master FETCH_HEAD
          # 恢复本步生成的 update.json，再与远程 master 对比
          cp /tmp/update.json.new update.json
          if git diff --quiet -- update.json; then
            echo "update.json 无变化，跳过推送"
            exit 0
          fi
          git add update.json
          git commit -m "chore(ci): update update.json for ${GITHUB_REF##*/} [skip ci]"
          git push origin HEAD:master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/nsis/*.exe
            ./dist/msi/*.msi
          # 正文由 Update update.json 步骤从 CHANGELOG.md 当前版本条目生成
          body_path: release_notes.md
